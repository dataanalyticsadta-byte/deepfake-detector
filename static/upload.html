<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Deepfake Detector Upload</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 24px; max-width: 720px; }
    label, button { display: block; margin: 12px 0; }
    pre { background:#f8f8f8; padding:12px; border:1px solid #ddd; overflow:auto; }
  </style>
</head>
<body>
  <h1>Upload Image or Video</h1>
  <p>Supports JPEG/PNG/WebP and MP4/MOV/MKV formats.</p>
  <input id="fileInput" type="file" accept="image/*,video/*" />
  <button id="uploadBtn">Upload and Analyze</button>
  <div id="message"></div>
  <pre id="output"></pre>

<script>
const input = document.getElementById('fileInput');
const button = document.getElementById('uploadBtn');
const output = document.getElementById('output');
const message = document.getElementById('message');

button.addEventListener('click', async () => {
  const file = input.files[0];
  if (!file) {
    message.textContent = 'Select a file first.';
    return;
  }
  message.textContent = 'Uploading...';
  output.textContent = '';
  const form = new FormData();
  form.append('file', file);

  try {
    const resp = await fetch('/analyze', {
      method: 'POST',
      body: form,
    });
    const data = await resp.json();
    // If breakdown present, render a friendly view
    if (data.breakdown) {
      let html = `<div><strong>Prediction:</strong> ${data.prediction} (${data.confidence}%)</div>`;
      html += `<div><strong>Heuristic score:</strong> ${data.fake_score ?? data.confidence}%</div>`;
      if ('model_loaded' in data) {
        html += `<div><strong>Model status:</strong> ${data.model_loaded ? `Loaded (${data.classifier_type || 'unknown'})` : 'No model loaded'}</div>`;
      }
      html += `<div><strong>Overall:</strong> AI: ${data.breakdown.AI}% — Real: ${data.breakdown.Real}%</div>`;
      if (data.classifier_score !== undefined && data.classifier_score !== null) {
        html += `<div><strong>Classifier:</strong> ${data.classifier_score}% — <strong>Combined:</strong> ${data.combined_score}%</div>`;
      }
      if (data.reason_scores) {
        html += '<div><strong>Reason scores:</strong><ul>';
        Object.entries(data.reason_scores).forEach(([label, score]) => {
          const flagged = (data.reasons || []).includes(label) ? ' <em>(flagged)</em>' : '';
          const explanation = (data.reason_details || {})[label] ? ' — ' + (data.reason_details || {})[label] : '';
          html += `<li>${label}: ${score}%${flagged}${explanation}</li>`;
        });
        html += '</ul></div>';
      }
      html += `<pre>${JSON.stringify(data.report || {}, null, 2)}</pre>`;
      output.innerHTML = html;
    } else {
      output.textContent = JSON.stringify(data, null, 2);
    }
    message.textContent = 'Analysis complete.';
  } catch (err) {
    message.textContent = 'Upload failed: ' + err.message;
  }
});
</script>
</body>
</html>

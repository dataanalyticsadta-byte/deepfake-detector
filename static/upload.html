<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Deepfake Detector Upload</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 24px; max-width: 720px; }
    label, button { display: block; margin: 12px 0; }
    pre { background:#f8f8f8; padding:12px; border:1px solid #ddd; overflow:auto; }
  </style>
</head>
<body>
  <h1>Upload Image or Video</h1>
  <p>Supports JPEG/PNG/WebP and MP4/MOV/MKV formats.</p>
  <input id="fileInput" type="file" accept="image/*,video/*" />
  <button id="uploadBtn">Upload and Analyze</button>
  <div id="message"></div>
  <pre id="output"></pre>

<script>
const input = document.getElementById('fileInput');
const button = document.getElementById('uploadBtn');
const output = document.getElementById('output');
const message = document.getElementById('message');

button.addEventListener('click', async () => {
  const file = input.files[0];
  if (!file) {
    message.textContent = 'Select a file first.';
    return;
  }
  message.textContent = 'Uploading...';
  output.textContent = '';
  const form = new FormData();
  form.append('file', file);

  try {
    const resp = await fetch('/analyze', {
      method: 'POST',
      body: form,
    });
    const data = await resp.json();
    output.textContent = JSON.stringify(data, null, 2);
    message.textContent = 'Analysis complete.';
  } catch (err) {
    message.textContent = 'Upload failed: ' + err.message;
  }
});
</script>
</body>
</html>
